<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Регистрация участника · Транспорт будущего</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="form.css?v=4">
<link rel="preload" as="image" href="assets/background.webp?v=20261107b">
<link rel="modulepreload" href="vendor/three/build/three.module.min.js">
<link rel="modulepreload" href="vendor/three/build/three.core.min.js">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{overflow:hidden;background:#cfe0f7}

  /* The stage keeps the picture's own aspect ratio (2800 x 1800) and covers the viewport.
     Background, 3D layer and cut-out layers share its coordinate space exactly.
     scene.js frames it per screen (which part of the picture stays in view);
     the CSS below is only the centred fallback before the script runs. */
  .viewport{position:fixed;inset:0;overflow:hidden}
  .stage{
    position:absolute;
    width:max(100vw, 100dvh * 2800 / 1800);
    aspect-ratio:2800 / 1800;
    left:50%;top:50%;transform:translate(-50%,-50%);
  }
  .stage.framed{transform:none}
  .stage > *{position:absolute;inset:0;width:100%;height:100%}
  .bg{background:url(assets/background.webp?v=20261107b) center/100% 100% no-repeat}
  canvas.world{display:block;pointer-events:none}
  .stage > .layer{inset:auto;pointer-events:none;z-index:2;visibility:hidden}
  .stage > .layer.placed{visibility:visible}   /* shown only once scene.js has put it in place */
  .bg{z-index:0} canvas.world{z-index:1}
  .stage > .layer.behind{z-index:0}   /* a layer the robot is currently in front of */
  .occ{background:url(assets/background.webp?v=20261107b) center/100% 100% no-repeat;pointer-events:none}
  .debug .occ{outline:2px solid #f0f;background-color:rgba(255,0,255,.15)}
</style>
</head>
<body>
<div class="viewport">
  <div class="stage" id="stage">
    <div class="bg" role="img" aria-label="Город будущего: эстакада, дорога, остановка и тоннель"></div>
    <canvas class="world" id="world"></canvas>
    <!-- Cut-out layers. data-x/y/w/h are in the ORIGINAL picture's pixels (1446 x 1087);
         scene.js places them inside the extended background. -->
    <!-- the arch (full length, with its second span), island, tree and lamp: traffic passes behind it -->
    <img class="layer" src="assets/arch-wide.webp" alt="" decoding="async" data-x="971" data-y="411" data-w="848.59" data-h="325.46">
    <!-- the station building: the monorail runs behind it. Cut at y 560 so the bench, bollards
         and stop below stay in the background and buses pass in front -->
    <img class="layer" src="assets/building.webp" alt="" decoding="async" data-x="0" data-y="68" data-w="375.25" data-h="492">
    <!-- right sidewalk: the flower planter and, in front of it, the lamp; the robot passes behind both -->
    <img class="layer" id="flowerLayer" src="assets/flower.webp" alt="" decoding="async" data-x="1369" data-y="726" data-w="77" data-h="168">
    <img class="layer" src="assets/lamp.webp" alt="" decoding="async" data-x="1332" data-y="737" data-w="45.08" data-h="185.31">
    <!-- the big tree on the right (wide background): the monorail and the flying car disappear behind it -->
    <img class="layer" src="assets/tree.webp" alt="" decoding="async" data-x="1436" data-y="-45.5" data-w="676.34" data-h="764.38">
    <!-- the bushes bed on the right (wide background): the robot comes in in front of it and leaves behind it -->
    <img class="layer" id="bushLayer" src="assets/bushes.webp" alt="" decoding="async" data-x="1363" data-y="678.5" data-w="749.25" data-h="245.75">

    <!-- occluders are injected here: copies of the picture clipped to things that stand in front of traffic -->
  </div>
</div>

<!-- ===== Registration form over the scene (Figma 189:19454) ===== -->
<div class="form-dim" aria-hidden="true"></div>
<button class="scene-pause" id="scenePause" type="button" aria-pressed="false" aria-label="Остановить анимацию фона"></button>

<div class="form-layer">
  <div class="form-scale">
    <form class="wow-form" id="profileForm" novalidate autocomplete="on">
      <div class="wow-form__aura" aria-hidden="true"></div>
      <div class="wow-form__glass">
        <header class="wf-header">
          <div class="wf-copy">
            <p class="wf-eyebrow">РЕГИСТРАЦИЯ УЧАСТНИКА</p>
            <h1 class="wf-title">Профиль участника</h1>
            <p class="wf-subtitle">Заполните основные данные</p>
          </div>
          <div class="wf-step" aria-label="Шаг 1 из 10">
            <span class="wf-step__num" id="stepNum">01</span>
            <span class="wf-step__total">из 10</span>
          </div>
        </header>

        <div class="wf-progress" aria-hidden="true">
          <span class="wf-progress__start">Профиль</span>
          <div class="wf-route"><img src="assets/form/route.svg" alt="" width="560" height="40"></div>
          <span class="wf-progress__end">Готово</span>
        </div>

        <div class="wf-fields">
          <div class="wf-field" data-required>
            <label class="wf-label" for="f-name">Имя *</label>
            <div class="wf-input">
              <input id="f-name" name="name" type="text" placeholder="Иван" autocomplete="given-name" required>
              <img class="wf-icon wf-icon--valid" src="assets/form/icon-valid.svg" alt="" width="24" height="24">
            </div>
          </div>
          <div class="wf-field">
            <label class="wf-label" for="f-patronymic">Отчество</label>
            <div class="wf-input">
              <input id="f-patronymic" name="patronymic" type="text" placeholder="Иванович" autocomplete="additional-name">
            </div>
          </div>
          <div class="wf-field" data-required>
            <label class="wf-label" for="f-surname">Фамилия *</label>
            <div class="wf-input">
              <input id="f-surname" name="surname" type="text" placeholder="Иванов" autocomplete="family-name" required>
              <img class="wf-icon wf-icon--valid" src="assets/form/icon-valid.svg" alt="" width="24" height="24">
            </div>
          </div>
          <div class="wf-field" data-required data-kind="date">
            <label class="wf-label" for="f-birth">Дата рождения *</label>
            <div class="wf-input">
              <input id="f-birth" name="birth" type="text" inputmode="numeric" placeholder="ДД.ММ.ГГГГ" maxlength="10" autocomplete="bday" required>
              <img class="wf-icon" src="assets/form/icon-calendar.svg" alt="" width="24" height="24">
            </div>
          </div>
        </div>

        <footer class="wf-footer">
          <p class="wf-autosave"><img src="assets/form/icon-autosave.svg" alt="" width="22" height="22">Данные сохраняются автоматически</p>
          <button class="wf-button" type="submit">
            <span class="wf-button__label">Продолжить</span>
            <img class="wf-button__capsule" src="assets/form/arrow-capsule.svg" alt="" width="60" height="60">
            <img class="wf-button__arrow" src="assets/form/icon-arrow-right.svg" alt="" width="24" height="24">
          </button>
        </footer>

        <div class="wf-beam" aria-hidden="true"></div>
        <img class="wf-point" src="assets/form/light-point.svg" alt="" width="24" height="24" aria-hidden="true">
      </div>
    </form>
  </div>
</div>

<script type="importmap">
{"imports":{
  "three":"./vendor/three/build/three.module.min.js",
  "three/addons/":"./vendor/three/examples/jsm/"
}}
</script>
<script type="module" src="scene.js?v=form2"></script>
<script src="form.js?v=2" defer></script>
</body>
</html>
